name: Sync ml/ to web-dev

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: sync-web-dev
  cancel-in-progress: false   

jobs:
  run-sync:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Run sync script from outside the repo
        env:
          SRC_REF: origin/main
          SYNC_DIR: ml
          TARGETS: "web-dev"
        run: |
          cp scripts/sync.sh "$RUNNER_TEMP/sync.sh"
          chmod +x "$RUNNER_TEMP/sync.sh"
          "$RUNNER_TEMP/sync.sh"
